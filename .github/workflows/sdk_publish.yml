name: Publish SDK to npm

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check if version exists on npm
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || echo "")
          
          if [ "$PUBLISHED_VERSION" == "$PACKAGE_VERSION" ]; then
            echo "Version $PACKAGE_VERSION already exists on npm. Skipping publication."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New version $PACKAGE_VERSION found. Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build SDK
        if: steps.check_version.outputs.skip == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check_version.outputs.skip == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}